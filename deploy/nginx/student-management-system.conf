# Nginx site configuration for the Student Management System.
#
# Install on Ubuntu:
#   sudo cp deploy/nginx/student-management-system.conf \
#     /etc/nginx/sites-available/student-management-system
#   sudo ln -s /etc/nginx/sites-available/student-management-system \
#     /etc/nginx/sites-enabled/student-management-system
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Update `server_name` and the `root` path if your domain or checkout
# location is different.

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain, or keep _ when using the EC2 public IP.
    server_name _;

    # React production build generated by `npm run build` in frontend/.
    root /var/www/student-management-system/frontend/dist;
    index index.html;

    client_max_body_size 1m;

    access_log /var/log/nginx/student-management-system.access.log;
    error_log /var/log/nginx/student-management-system.error.log;

    # Compress text-based assets.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API calls to the Express server managed by PM2.
    # proxy_pass without a URI preserves the /api/... path.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Vite fingerprints filenames in /assets, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # Always revalidate the HTML entry point after a new deployment.
    location = /index.html {
        expires -1;
    }

    # Serve static files and fall back to index.html for React Router paths
    # such as /add and /edit/:id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
